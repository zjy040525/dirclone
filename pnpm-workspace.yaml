  dev:
    '@antfu/eslint-config': ^9.3.0
    bumpp: ^12.2.0
    eslint: ^10.8.1
    eslint-plugin-format: ^2.0.1
    publint: ^0.3.23
    tsx: ^4.23.12
    typescript: ^6.0.3
  prod:
    ansis: ^4.3.1
    cac: ^7.0.0
    cli-progress: ^3.12.0
    deepmerge: ^4.3.1
    restore-cursor: ^5.1.0
    ts-json-schema-generator: ^2.9.0
    unconfig: ^7.5.0
  testing:
    vitest: ^4.1.10
  types:
    '@types/cli-progress': ^3.11.6
    '@types/node': ^26.2.0

update:
  ignoreDeps:
    - typescript@7

allowBuilds:
  esbuild: true
